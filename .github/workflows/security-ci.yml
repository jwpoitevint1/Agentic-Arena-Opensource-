name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_DIRECT_MODEL_ROUTES: "true"
      ENABLE_SYSTEM_DIAGNOSTICS: "true"
      API_AUTH_REQUIRED: "false"
      API_DOCS_ENABLED: "false"
      MAX_REQUEST_BYTES: "1048576"
      RATE_LIMIT_PER_MINUTE: "10000"
      PYTHONPATH: "."
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pip-audit

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run security gate tests
        run: |
          pytest -q \
            tests/test_security_middleware.py \
            tests/test_integrity.py \
            tests/test_model_routes.py \
            tests/test_system_endpoints.py \
            tests/test_execution_routing.py \
            tests/test_dataset_registry.py \
            tests/test_ungoverned_workflow.py \
            tests/test_chatbot_guardrails.py

      - name: Report full regression drift
        continue-on-error: true
        run: pytest -q

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Validate Docker and OPA build
        run: docker build --pull -t agentic-arena-security-ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install UI dependencies
        run: npm --prefix ui install --no-fund

      - name: Audit UI dependencies
        run: npm --prefix ui audit --audit-level=high

      - name: Build UI
        run: npm --prefix ui run build
